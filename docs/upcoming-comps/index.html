<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Upcoming Comps - RaspBella</title>
    <link rel="stylesheet" href="/main.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png">
    <link rel="manifest" href="/favicon/site.webmanifest">
  </head>
  <body>
    <ul class="nav">
      <li><a href="/">home</a></li>
      <li><a href="/RaspBella">about</a></li>
      <li><a class="active" href="/cubing">cubing</a></li>
      <li><a href="/linux">linux</a></li>
      <li><a href="/media">media</a></li>
      <li><a href="/trans">transportation</a></li>
      <li><a href="/blog">blog</a></li>
    </ul>
    <div>
      <label for="input-wcaid">Input WCA ID:</label>
      <input id="input-wcaid"/>
      <button onclick="submit_wcaid()">+</button>
      <button onclick="clear_wcaids()" style="float: right;">Clear WCAID(s)</button>

      <div id="persons" style="display: none;">
        <label for="persons-list">WCA ID(s)</label>
        <ul id="persons-list"></ul>
        <button onclick="submit_wcaids()">Query Upcoming Comps</button>
      </div>

      <div id="results" style="display: none;"></div>
    </div>
  </body>
  <script>
    const persons = new Set();

    const valid_wcaid = /^[0-9]{4}[a-zA-Z]{4}[0-9]{2}$/;

    const input_wcaid = document.getElementById("input-wcaid");

    const persons_html = document.getElementById("persons");
    const persons_html_list = document.getElementById("persons-list");

    const results_html = document.getElementById("results");

    function update_html(persons_html_list) {
      persons_html_list.innerHTML = [...persons]
        .map(wcaid => `<li>${wcaid}<button onclick="
          if (persons.size === 1) {
            clear_wcaids();
          } else {
            persons.delete('${wcaid}');
            update_html(persons_html_list);
          }
          ">-</button></li>`)
        .join("");
    }

    [...new URLSearchParams(location.search).keys()]
      .map(wcaid => {
        if (valid_wcaid.test(wcaid)) {
          persons.add(wcaid);
        }
      });

    async function fetch_results() {
      const results = new Map();

      await Promise.all(
        [...persons].map(async (wcaid) => {
          const response = await fetch(`https://www.worldcubeassociation.org/api/v0/users/${wcaid}?upcoming_competitions=true`);

          if (!response.ok && response.status != 404) {
            throw new Error(`Failed to fetch ${wcaid}: ${response.status}`);
          }

          results.set(wcaid, await response.json());
        })
      );

      return results;
    }

    if (persons.size > 0) {
      fetch_results().then((results) => {
        for (const [wcaid, data] of results) {
          if (!data.user) {
            results.delete(wcaid);
            persons.delete(wcaid);
          }
        }

        if (persons.size > 0) {
          update_html(persons_html_list);

          persons_html.style.display = "block";

          const comps = new Map();

          [...results.values()]
            .flatMap(value => value?.upcoming_competitions ?? [])
            .sort((a, b) => {
              return a.id > b.id;
            })
            .sort((a, b) => {
              return a.start_date > b.start_date;
            })
            .sort((a, b) => {
              return a.end_date > b.end_date;
            })
            .forEach(data => {
              comps.set(data.id, {
                name: data.name,
                date_range: data.date_range
              });
            });

          results_html.innerHTML = "<table><thead><tr><th>Date</th><th>Comp</th>"
            + [...persons]
              .map(wcaid =>
                `<th>
                  ${results.get(wcaid).user.name} (<a href="https://www.worldcubeassociation.org/persons/${wcaid}">${wcaid}</a>)
                </th>`)
              .join("")
            + "</tr></thead></tbody>"
            + [...comps]
              .map(comp =>
                `<tr>
                  <td>${comp[1].date_range}</td>
                  <td><a href="https://www.worldcubeassociation.org/competitions/${comp[0]}">${comp[1].name}</a></td>`
                + [...persons]
                  .map(wcaid => {
                    const attending = results.get(wcaid)?.upcoming_competitions.some(obj => obj.id === comp[0]);

                    return attending ? `<td style="background-color: #008000;">Registered</td>` : `<td style="background-color: #FF0000;">Not Registered</td>`;
                  })
                  .join("")
                + "</tr>")
              .join("")
            + "</tbody></table>";

          results_html.style.display = "block";
        }
      });
    }

    function submit_wcaid() {
      if (valid_wcaid.test(input_wcaid.value)) {
        persons.add(input_wcaid.value.toUpperCase());

        update_html(persons_html_list);

        persons_html.style.display = "block";
      }

      input_wcaid.value = "";
    };

    function clear_wcaids() {
      location.search = "";
    };

    function submit_wcaids() {
      location.search = `?${[...persons].join("&")}`;
    };
  </script>
</html>
